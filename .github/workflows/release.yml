name: release

on:
  push:
    branches: [main]
    paths: ["src/**", "go.mod", "go.sum", "assets/icon.png", "build.sh", "scripts/**"]

permissions:
  contents: write

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build all platforms
        run: ./build.sh "v0.1.${{ github.run_number }}"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v0.1.${{ github.run_number }}" dist/* --target "${{ github.sha }}" --generate-notes
